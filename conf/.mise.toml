[tools]
node = "24"
aube = "latest"

[env]
NODE_OPTIONS = "--max-old-space-size=4096"
TURBO_TELEMETRY_DISABLED = "1"

[tasks.build]
description = "Build app, run database migrations, and clean store"
run = """
aube install
aube run build --concurrency=1
aube run db:migration:sqlite:run
aube store prune
"""
