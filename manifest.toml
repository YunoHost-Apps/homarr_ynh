packaging_format = 2

id = "homarr"
name = "Homarr"
description.en = "Customizable browser's home page to interact with your homeserver's Docker containers"
description.fr = "Page d'accueil personnalisable pour interagir avec les conteneurs Docker de votre serveur"

version = "2.11.1~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://homarr.dev/"
admindoc = "https://homarr.dev/docs/getting-started"
userdoc = "https://homarr.dev/docs/category/management"
code = "https://github.com/homarr-labs/homarr"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = true
sso = false

disk = "3G"
ram.build = "2G"
ram.runtime = "2G"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        amd64.url = "https://github.com/homarr-labs/homarr/releases/download/v2.11.1/build-debian-amd64.tar.gz"
        amd64.sha256 = "2c1e83a88a421784710ef4587d8965a0c14ca291ea83bafd16d36aeaa63e4458"
        arm64.url = "https://github.com/homarr-labs/homarr/releases/download/v2.11.1/build-debian-arm64.tar.gz"
        arm64.sha256 = "894e5b96e2815a3fee997a9a6ebaa52608e383bbb27a24a4f3864cc8c726236c"
        
        autoupdate.strategy = "latest_github_release"

        autoupdate.asset.amd64 = "^build-debian-amd64.tar.gz$"
        autoupdate.asset.arm64 = "^build-debian-arm64.tar.gz$"

    [resources.ports]
        main.default = 4000 
        websocket.default = 3001
        websocket.fixed = true
        
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.apt]
    packages = "sqlite3, redis-server, ca-certificates" 

    [resources.nodejs]
    version = "24"
