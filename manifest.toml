packaging_format = 2

id = "homarr"
name = "Homarr"
description.en = "Customizable browser's home page to interact with your homeserver's Docker containers"
description.fr = "Page d'accueil personnalisable pour interagir avec les conteneurs Docker de votre serveur"

version = "2.10.1~ynh1"

maintainers = []

[upstream]
license = "MIT"
website = "https://homarr.dev/"
admindoc = "https://homarr.dev/docs/getting-started"
userdoc = "https://homarr.dev/docs/category/management"
code = "https://github.com/homarr-labs/homarr"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = true
sso = false

disk = "3G"
ram.build = "2G"
ram.runtime = "2G"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
        [resources.sources.main]
        amd64.url = "https://github.com/homarr-labs/homarr/releases/download/v2.10.1/build-debian-amd64.tar.gz"
        amd64.sha256 = "90369df0075753939a6cf4a4f7f4b55b50274ead836ae6dc9999cfaf316d500e"
        arm64.url = "https://github.com/homarr-labs/homarr/releases/download/v2.10.1/build-debian-arm64.tar.gz"
        arm64.sha256 = "c8f897832011c604299cc0962e66ee1505718061e297ee07c37fbc5ce47d8dc7"
        
        autoupdate.strategy = "latest_github_release"

        autoupdate.asset.amd64 = "^build-debian-amd64.tar.gz$"
        autoupdate.asset.arm64 = "^build-debian-arm64.tar.gz$"

    [resources.ports]
        main.default = 4000 
        websocket.default = 3001
        websocket.fixed = true
        
    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    main.auth_header = false

    [resources.apt]
    packages = "sqlite3, redis-server, ca-certificates" 

    [resources.nodejs]
    version = "24"
